<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
        }
        button:hover {
            background: #5568d3;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔔 Browser Notification Test</h1>
    
    <div class="test-section">
        <h2>1. Browser Qo'llab-quvvatlash</h2>
        <div id="support-status"></div>
    </div>

    <div class="test-section">
        <h2>2. Permission Holati</h2>
        <div id="permission-status"></div>
        <button onclick="requestPermission()">Permission So'rash</button>
    </div>

    <div class="test-section">
        <h2>3. Test Notification</h2>
        <button onclick="showTestNotification()">Test Notification Ko'rsatish</button>
        <div id="test-result"></div>
    </div>

    <div class="test-section">
        <h2>4. API Test</h2>
        <button onclick="testAPI()">API Test Qilish</button>
        <div id="api-result"></div>
    </div>

    <div class="test-section">
        <h2>5. Debug Ma'lumotlari</h2>
        <button onclick="showDebugInfo()">Debug Info Ko'rsatish</button>
        <pre id="debug-info"></pre>
    </div>

    <script>
        // 1. Browser qo'llab-quvvatlashini tekshirish
        function checkSupport() {
            const supportDiv = document.getElementById('support-status');
            if ('Notification' in window) {
                supportDiv.innerHTML = '<div class="status success">✅ Browser notification\'larni qo\'llab-quvvatlaydi</div>';
                return true;
            } else {
                supportDiv.innerHTML = '<div class="status error">❌ Browser notification\'larni qo\'llab-quvvatlamaydi</div>';
                return false;
            }
        }

        // 2. Permission holatini ko'rsatish
        function checkPermission() {
            const permDiv = document.getElementById('permission-status');
            const permission = Notification.permission;
            
            let html = '<div class="status ';
            if (permission === 'granted') {
                html += 'success">✅ Permission berilgan';
            } else if (permission === 'denied') {
                html += 'error">❌ Permission rad etilgan';
            } else {
                html += 'info">⚠️ Permission hali so\'ralmagan';
            }
            html += '</div>';
            html += '<p>Holat: <strong>' + permission + '</strong></p>';
            
            permDiv.innerHTML = html;
        }

        // 3. Permission so'rash
        async function requestPermission() {
            if (!('Notification' in window)) {
                alert('Browser notification\'larni qo\'llab-quvvatlamaydi');
                return;
            }

            try {
                const permission = await Notification.requestPermission();
                checkPermission();
                
                if (permission === 'granted') {
                    alert('✅ Permission berildi!');
                    showTestNotification();
                } else {
                    alert('❌ Permission rad etildi');
                }
            } catch (error) {
                alert('Xatolik: ' + error.message);
            }
        }

        // 4. Test notification ko'rsatish
        function showTestNotification() {
            const resultDiv = document.getElementById('test-result');
            
            if (Notification.permission !== 'granted') {
                resultDiv.innerHTML = '<div class="status error">❌ Avval permission bering</div>';
                return;
            }

            try {
                const notification = new Notification('🎉 Test Notification', {
                    body: 'Agar buni ko\'rsangiz, notification ishlayapti!',
                    icon: 'https://via.placeholder.com/192',
                    badge: 'https://via.placeholder.com/96',
                    tag: 'test-notification',
                    requireInteraction: false
                });

                notification.onclick = function() {
                    alert('Notification bosildi!');
                    notification.close();
                };

                setTimeout(() => {
                    notification.close();
                }, 5000);

                resultDiv.innerHTML = '<div class="status success">✅ Notification yuborildi! 5 soniyadan keyin yopiladi.</div>';
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ Xatolik: ' + error.message + '</div>';
            }
        }

        // 5. API test
        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = '<div class="status info">⏳ API test qilinmoqda...</div>';

            try {
                const response = await fetch('/api/notifications/unread/', {
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                const data = await response.json();
                
                let html = '<div class="status success">✅ API ishlayapti</div>';
                html += '<p>Status: ' + response.status + '</p>';
                html += '<p>Notification\'lar soni: ' + (data.count || 0) + '</p>';
                html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = '<div class="status error">❌ API xatosi: ' + error.message + '</div>';
            }
        }

        // 6. Debug ma'lumotlari
        function showDebugInfo() {
            const debugDiv = document.getElementById('debug-info');
            
            const info = {
                'Browser': navigator.userAgent,
                'Notification Support': 'Notification' in window,
                'Permission': Notification.permission,
                'Service Worker Support': 'serviceWorker' in navigator,
                'Push Support': 'PushManager' in window,
                'Current URL': window.location.href,
                'Protocol': window.location.protocol,
                'Timestamp': new Date().toISOString()
            };

            debugDiv.textContent = JSON.stringify(info, null, 2);
        }

        // Sahifa yuklanganda
        window.onload = function() {
            checkSupport();
            checkPermission();
            
            // Har 2 soniyada permission holatini yangilash
            setInterval(checkPermission, 2000);
        };
    </script>
</body>
</html>
