{% extends 'base.html' %}

{% block title %}Parolni tiklash - EduSelf{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="text-center mb-4">
        <i class="bi bi-key text-primary" style="font-size: 3rem;"></i>
    </div>
    <h4 class="auth-title">Parolni tiklash</h4>
    <p class="auth-subtitle">Email manzilingizni kiriting</p>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-4">
            <label class="form-label">{{ form.email.label }}</label>
            {{ form.email }}
            {% if form.email.errors %}
            <div class="text-danger small mt-1">{{ form.email.errors.0 }}</div>
            {% endif %}
        </div>
        
        <button type="submit" class="btn btn-primary w-100">Yuborish</button>
    </form>
    
    <div class="auth-footer">
        <a href="{% url 'accounts:login' %}">Kirish sahifasiga qaytish</a>
    </div>
</div>
{% endblock %}
