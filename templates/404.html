{% extends 'base.html' %}
{% load static %}

{% block title %}404 - Sahifa topilmadi | EduSelf{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center;">
    <div>
        <div style="font-size: 100px; font-weight: 900; color: #6366f1; margin-bottom: 20px;">404</div>
        <div style="font-size: 60px; margin-bottom: 20px;">🤔</div>
        <h1 style="font-size: 28px; font-weight: 700; color: #1f2937; margin-bottom: 15px;">Sahifa topilmadi</h1>
        <p style="font-size: 16px; color: #6b7280; margin-bottom: 30px;">
            Siz qidirayotgan sahifa mavjud emas
        </p>
        <div style="display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto;">
            <a href="{% url 'core:home' %}" style="padding: 15px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 10px; text-decoration: none; font-weight: 600;">
                <i class="fas fa-home"></i> Bosh sahifa
            </a>
            <button onclick="window.history.back()" style="padding: 15px 30px; background: white; color: #667eea; border: 2px solid #667eea; border-radius: 10px; font-weight: 600; cursor: pointer;">
                <i class="fas fa-arrow-left"></i> Orqaga
            </button>
        </div>
    </div>
</div>
{% endblock %}
