{% extends 'base.html' %}
{% load static %}

{% block title %}AI Hamroh - EduSelf{% endblock %}

{% block messages %}{% endblock %}
{% block ai_fab %}{% endblock %}

{% block extra_css %}
<style>
/* Confirm Modal */
.confirm-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
}

.confirm-modal.active {
    display: flex;
}

.confirm-modal-content {
    background: var(--card-bg, #fff);
    border-radius: 16px;
    padding: 1.5rem;
    max-width: 320px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.confirm-modal-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
}

.confirm-modal-icon i {
    font-size: 1.5rem;
    color: white;
}

.confirm-modal-content h3 {
    color: var(--text-color, #333);
    margin-bottom: 0.5rem;
    font-size: 1.1rem;
}

.confirm-modal-content p {
    color: var(--text-muted, #666);
    margin-bottom: 1.25rem;
    font-size: 0.9rem;
}

.confirm-modal-buttons {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
}

.confirm-btn {
    padding: 0.6rem 1.25rem;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-size: 0.9rem;
}

.confirm-btn.cancel {
    background: var(--bg-color, #f3f4f6);
    color: var(--text-color, #333);
}

.confirm-btn.confirm {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
}

/* Main Layout */
.ai-chat-page {
    height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
    background: var(--bg-color, #f8f9fa);
    margin: -16px;
    width: calc(100% + 32px);
}

/* Header */
.ai-mobile-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}

.ai-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.ai-header-avatar {
    width: 38px;
    height: 38px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
}

.ai-header-info h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
}

.ai-header-info p {
    margin: 0;
    font-size: 0.7rem;
    opacity: 0.85;
}

.ai-header-actions {
    display: flex;
    gap: 8px;
}

.header-action-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

/* Messages Container */
.ai-messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    padding-bottom: 80px;
}

/* Welcome */
.ai-welcome-mobile {
    text-align: center;
    padding: 2rem 1rem;
}

.welcome-icon-mobile {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
    font-size: 2rem;
    color: white;
}

.ai-welcome-mobile h3 {
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    color: var(--text-color, #333);
}

.ai-welcome-mobile p {
    font-size: 0.85rem;
    color: var(--text-muted, #666);
    margin-bottom: 1.5rem;
}

.quick-actions-mobile {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.quick-action-mobile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    background: var(--card-bg, #fff);
    border: 1px solid var(--border-color, #e5e7eb);
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
}

.quick-action-mobile i {
    font-size: 1.2rem;
    color: var(--primary-color, #667eea);
}

.quick-action-mobile span {
    font-size: 0.85rem;
    color: var(--text-color, #333);
}

/* Messages */
.ai-msg {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.ai-msg.user {
    flex-direction: row-reverse;
}

.msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
    color: white;
}

.ai-msg.user .msg-avatar {
    background: var(--primary-color, #667eea);
}

.ai-msg.bot .msg-avatar {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.msg-bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
}

.ai-msg.user .msg-bubble {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 16px 16px 4px 16px;
}

.ai-msg.bot .msg-bubble {
    background: var(--card-bg, #fff);
    border: 1px solid var(--border-color, #e5e7eb);
    border-radius: 16px 16px 16px 4px;
}

.msg-text {
    font-size: 0.9rem;
    line-height: 1.5;
    margin: 0;
    word-break: break-word;
}

.msg-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
}

.msg-time {
    font-size: 0.65rem;
    opacity: 0.6;
}

.msg-source {
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(99, 102, 241, 0.1);
    color: var(--primary-color, #667eea);
}

.msg-image {
    max-width: 100%;
    max-height: 150px;
    border-radius: 8px;
    margin-bottom: 6px;
}

.msg-file {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: rgba(99, 102, 241, 0.1);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 0.8rem;
    color: var(--primary-color, #667eea);
}
