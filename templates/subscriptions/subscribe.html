{% extends 'base.html' %}
{% load static %}

{% block title %}{{ plan.name }} - Sotib olish{% endblock %}

{% block content %}
<div class="container py-4">
    <!-- Back button -->
    <a href="{% url 'subscriptions:pro_page' %}" class="btn btn-light rounded-pill mb-3">
        <i class="bi bi-arrow-left me-2"></i> Orqaga
    </a>

    <!-- Plan info -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-4">
            <div class="d-flex align-items-center mb-3">
                <div class="rounded-circle d-flex align-items-center justify-content-center me-3" 
                     style="width: 60px; height: 60px; background: {{ plan.color }}20;">
                    <i class="{{ plan.icon }} text-primary" style="font-size: 2rem;"></i>
                </div>
                <div>
                    <h3 class="mb-0 fw-bold">{{ plan.name }}</h3>
                    <p class="text-muted mb-0">{{ plan.description }}</p>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-between">
                <div>
                    <h2 class="fw-bold mb-0" style="color: {{ plan.color }};">
                        <span id="final-price">{{ plan.price|floatformat:0 }}</span> <small class="text-muted fs-6">so'm</small>
                    </h2>
                    <small class="text-muted">{{ plan.duration_days }} kun</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment form -->
    <form method="post" id="payment-form">
        {% csrf_token %}
        
        <!-- Promokod -->
        <div class="card border-0 shadow-sm rounded-4 mb-3">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Promokod</h5>
                <div class="input-group">
                    <input type="text" class="form-control rounded-start-pill" 
                           name="promo_code" id="promo-code" placeholder="Promokodni kiriting">
                    <button type="button" class="btn btn-outline-primary rounded-end-pill" 
                            id="check-promo">
                        Tekshirish
                    </button>
                </div>
                <div id="promo-message" class="mt-2"></div>
            </div>
        </div>

        <!-- To'lov usuli -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">To'lov usuli</h5>
                
                <div class="form-check mb-3 p-3 border rounded-3">
                    <input class="form-check-input" type="radio" name="payment_method" 
                           id="click" value="click" checked>
                    <label class="form-check-label d-flex align-items-center" for="click">
                        <img src="{% static 'images/click-logo.png' %}" alt="Click" height="30" class="me-2">
                        <span class="fw-bold">Click</span>
                    </label>
                </div>

                <div class="form-check p-3 border rounded-3">
                    <input class="form-check-input" type="radio" name="payment_method" 
                           id="payme" value="payme">
                    <label class="form-check-label d-flex align-items-center" for="payme">
                        <img src="{% static 'images/payme-logo.png' %}" alt="Payme" height="30" class="me-2">
                        <span class="fw-bold">Payme</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- To'lov tugmasi -->
        <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold">
            <i class="bi bi-credit-card me-2"></i>
            To'lovga o'tish
        </button>
    </form>
</div>

<script>
document.getElementById('check-promo').addEventListener('click', function() {
    const code = document.getElementById('promo-code').value;
    const planSlug = '{{ plan.slug }}';
    
    if (!code) {
        return;
    }
    
    fetch('{% url "subscriptions:check_promo" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: `code=${code}&plan_slug=${planSlug}`
    })
    .then(response => response.json())
    .then(data => {
        const messageDiv = document.getElementById('promo-message');
        if (data.valid) {
            messageDiv.innerHTML = `<div class="alert alert-success small mb-0">${data.message}</div>`;
            document.getElementById('final-price').textContent = data.final_price.toFixed(0);
        } else {
            messageDiv.innerHTML = `<div class="alert alert-danger small mb-0">${data.message}</div>`;
        }
    });
});
</script>
{% endblock %}
