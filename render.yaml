services:
  # Django Web Service
  - type: web
    name: eduself-web
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn eduself.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: eduself-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,eduself.uz"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_CHANNEL_USERNAME
        sync: false
      - key: SITE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

  # Telegram Bot Background Worker
  - type: worker
    name: eduself-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py runbot
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: eduself-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_CHANNEL_USERNAME
        sync: false
      - key: SITE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

databases:
  - name: eduself-db
    plan: free
